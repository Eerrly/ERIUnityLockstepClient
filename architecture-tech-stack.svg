<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ERIUnitySimpleClient 架构设计图</title>
  <desc id="desc">展示 Unity 客户端入口、TCP 和 KCP 双通道、帧同步核心模块、回放模块以及资源与场景关系的简洁架构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#e8f1ec"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#355c7d"/>
      <stop offset="100%" stop-color="#3b7a57"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4e6872"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #ffffff; }
      .subtitle { font: 400 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #dbe8ea; }
      .box-title { font: 700 24px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #18343d; }
      .box-subtitle { font: 600 18px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #2a4f59; }
      .body { font: 400 16px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #30474f; }
      .small { font: 400 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #566971; }
      .label { font: 700 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #3b5560; }
      .pill { font: 700 15px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #fff; }
      .shadow { filter: drop-shadow(0 10px 18px rgba(25, 53, 68, 0.12)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>
  <rect x="40" y="34" width="1520" height="94" rx="24" fill="url(#header)"/>
  <text x="76" y="83" class="title">ERIUnitySimpleClient 架构设计图</text>
  <text x="76" y="110" class="subtitle">Unity / URP / UGUI / TCP / KCP / Protobuf / Frame Sync / Replay</text>

  <g class="shadow">
    <rect x="70" y="184" width="290" height="228" rx="24" fill="#fff7ed" stroke="#e4b57c" stroke-width="2"/>
    <text x="102" y="230" class="box-title">客户端入口</text>
    <text x="102" y="266" class="body">- Main.cs</text>
    <text x="102" y="298" class="body">- GameManager</text>
    <text x="102" y="330" class="body">- NetworkManager</text>
    <text x="102" y="362" class="body">- InputManager / CameraManager</text>
    <text x="102" y="394" class="body">- BattleRecordManager</text>
  </g>

  <g class="shadow">
    <rect x="448" y="176" width="300" height="122" rx="24" fill="#eef7ff" stroke="#8ab6da" stroke-width="2"/>
    <text x="484" y="221" class="box-title">TCP 通道</text>
    <text x="484" y="254" class="body">大厅与房间逻辑</text>
    <text x="484" y="282" class="small">Login / CreateRoom / JoinRoom</text>
  </g>

  <g class="shadow">
    <rect x="448" y="330" width="300" height="122" rx="24" fill="#edf9f1" stroke="#8bc09d" stroke-width="2"/>
    <text x="484" y="375" class="box-title">KCP 通道</text>
    <text x="484" y="408" class="body">战斗实时消息</text>
    <text x="484" y="436" class="small">Connect / Ready / Heartbeat / Frame / Check</text>
  </g>

  <g class="shadow">
    <rect x="850" y="150" width="680" height="520" rx="28" fill="#fcfffd" stroke="#9ab8aa" stroke-width="2"/>
    <text x="888" y="198" class="box-title">帧同步核心</text>

    <rect x="888" y="230" width="280" height="130" rx="20" fill="#f4f8ff" stroke="#9eb8e3" stroke-width="2"/>
    <text x="916" y="268" class="box-subtitle">FrameEngine</text>
    <text x="916" y="300" class="body">- NetUpdate</text>
    <text x="916" y="328" class="body">- LogicUpdate</text>
    <text x="916" y="356" class="body">- ReplayUpdate</text>

    <rect x="1200" y="230" width="292" height="130" rx="20" fill="#fff6ee" stroke="#dfb181" stroke-width="2"/>
    <text x="1228" y="268" class="box-subtitle">BattleController</text>
    <text x="1228" y="300" class="body">- 输入发送</text>
    <text x="1228" y="328" class="body">- 预测推进</text>
    <text x="1228" y="356" class="body">- 确认与回滚</text>

    <rect x="888" y="398" width="280" height="146" rx="20" fill="#eef8f2" stroke="#93c4a4" stroke-width="2"/>
    <text x="916" y="438" class="box-subtitle">FrameBuffer</text>
    <text x="916" y="470" class="body">- 缓存服务端权威输入帧</text>
    <text x="916" y="498" class="body">- TryGetFrame / SyncFrame</text>
    <text x="916" y="526" class="body">- 作为确认链路的输入来源</text>

    <rect x="1200" y="398" width="292" height="146" rx="20" fill="#f8f2ff" stroke="#b29fda" stroke-width="2"/>
    <text x="1228" y="438" class="box-subtitle">三套实体</text>
    <text x="1228" y="470" class="body">- ConfirmBattleEntity</text>
    <text x="1228" y="498" class="body">- PredictBattleEntity</text>
    <text x="1228" y="526" class="body">- DisplayBattleEntity</text>

    <rect x="888" y="578" width="604" height="60" rx="18" fill="#fffdf2" stroke="#d3c16f" stroke-width="2"/>
    <text x="916" y="616" class="body">收到服务端输入帧后，先比较预测帧；命中则直接复用预测实体，失配则从确认态继续重算</text>
  </g>

  <g class="shadow">
    <rect x="70" y="470" width="678" height="220" rx="28" fill="#ffffff" stroke="#c9d9d0" stroke-width="2"/>
    <text x="106" y="518" class="box-title">渲染与回放</text>

    <rect x="106" y="548" width="260" height="104" rx="18" fill="#f4f8ff" stroke="#9eb8e3" stroke-width="2"/>
    <text x="132" y="586" class="box-subtitle">BattleView / PlayerView</text>
    <text x="132" y="616" class="small">渲染 DisplayBattleEntity</text>
    <text x="132" y="640" class="small">只负责表现层，不参与权威判定</text>

    <rect x="396" y="548" width="316" height="104" rx="18" fill="#eef8f2" stroke="#93c4a4" stroke-width="2"/>
    <text x="422" y="586" class="box-subtitle">BattleRecordManager / ReplayController</text>
    <text x="422" y="616" class="small">记录确认后的状态</text>
    <text x="422" y="640" class="small">离线按 BattleInterval 回放</text>
  </g>

  <g class="shadow">
    <rect x="70" y="732" width="1460" height="154" rx="26" fill="#f9fbfc" stroke="#b6c8cf" stroke-width="2"/>
    <text x="106" y="780" class="box-title">关键参数</text>
    <rect x="106" y="804" width="176" height="38" rx="19" fill="#355c7d"/>
    <text x="151" y="829" class="pill">Unity 2022.3</text>
    <rect x="300" y="804" width="166" height="38" rx="19" fill="#3b7a57"/>
    <text x="349" y="829" class="pill">TCP 10085</text>
    <rect x="484" y="804" width="166" height="38" rx="19" fill="#b86f52"/>
    <text x="533" y="829" class="pill">KCP 10086</text>
    <rect x="668" y="804" width="176" height="38" rx="19" fill="#7d6aa7"/>
    <text x="712" y="829" class="pill">Battle 33ms</text>
    <rect x="862" y="804" width="176" height="38" rx="19" fill="#9a8a33"/>
    <text x="897" y="829" class="pill">Heartbeat 1000ms</text>
    <rect x="1056" y="804" width="176" height="38" rx="19" fill="#486b7a"/>
    <text x="1085" y="829" class="pill">MaxPredict 4</text>
    <rect x="1250" y="804" width="200" height="38" rx="19" fill="#6b7280"/>
    <text x="1287" y="829" class="pill">Check Every 200</text>
  </g>

  <line x1="360" y1="245" x2="448" y2="225" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="360" y1="340" x2="448" y2="390" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="748" y1="225" x2="850" y2="252" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="748" y1="390" x2="850" y2="448" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1030" y1="360" x2="1030" y2="398" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1320" y1="360" x2="1320" y2="398" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1030" y1="544" x2="340" y2="600" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1346" y1="544" x2="554" y2="600" stroke="#4e6872" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="378" y="210" class="label">大厅逻辑</text>
  <text x="378" y="396" class="label">战斗消息</text>
  <text x="770" y="220" class="label">管理器入口</text>
  <text x="768" y="430" class="label">同步输入帧</text>
  <text x="816" y="586" class="label">显示层</text>
  <text x="1044" y="590" class="label">记录与回放</text>
</svg>
